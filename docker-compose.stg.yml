services:
  app:
    build: .
    container_name: instru-proyect-app-stg
    ports:
      - '3001:3000'
    environment:
      - NODE_ENV=staging
    env_file:
      - .stg.env
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17
    container_name: instru-proyect-postgres-stg
    environment:
      - POSTGRES_DB=auth_stg_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=123456
    ports:
      - '5433:5432'
    volumes:
      - ./postgres_data_stg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d auth_stg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: instru-proyect-pgadmin-stg
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports: 
      - "5051:80"
    depends_on:
      - postgres
    restart: unless-stopped
